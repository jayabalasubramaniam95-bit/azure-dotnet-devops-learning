
name: Build and publish Product API Docker image

on:
  push:
    branches:
      - feature/azure-deployment

  workflow_dispatch:
    inputs:
      rollback_commit:
        description: 'Commit SHA to build. Leave empty to build current branch.'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/jayabalasubramaniam95-bit/productapi

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_commit || github.ref }}

      - name: Show selected commit
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building commit: $SHA"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Product API
        run: dotnet restore ProductApi/ProductApi.csproj

      - name: Restore tests
        run: dotnet restore ProductApi.Tests/ProductApi.Tests.csproj

      - name: Build Product API
        run: dotnet build ProductApi/ProductApi.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test ProductApi.Tests/ProductApi.Tests.csproj --configuration Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}

      - name: Deployment preparation successful
        run: |
          echo "Docker image built and published successfully."
          echo "Image: $IMAGE_NAME"
          echo "Commit: ${{ steps.commit.outputs.sha }}"
